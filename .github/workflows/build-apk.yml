name: Build Kaelix‑Box APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu‑latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup‑java@v5
        with:
          java‑version: '17'
          distribution: 'temurin'

      # 配置国内Maven镜像，解决依赖下载卡死
      - name: Configure gradle mirror
        run: |
          mkdir -p ~/.gradle
          echo "systemProp.https.proxyHost=mirrors.cloud.tencent.com" > ~/.gradle/gradle.properties
          echo "systemProp.https.proxyPort=80" >> ~/.gradle/gradle.properties

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload built APK
        uses: actions/upload‑artifact@v4
        with:
          name: Kaelix‑Box‑Release‑APK
          path: app/build/outputs/apk/release/*.apk
